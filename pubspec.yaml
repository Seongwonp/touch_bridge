name: touch_bridge
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  http: ^1.2.2
  http_parser: ^4.0.0
  path_provider: ^2.1.4
  flutter_dotenv: ^5.1.0
  google_generative_ai: ^0.2.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  flutter_blue_plus: ^1.35.5
  permission_handler: ^12.0.1
  nfc_manager: ^3.3.0
  url_launcher: ^6.3.1
  crypto: ^3.0.7
  flutter_secure_storage: ^8.0.0
  audioplayers: ^6.1.0
  vibration: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/sounds/
