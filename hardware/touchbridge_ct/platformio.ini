; touchbridge_ct — CT 전력 측정 노드. SEN0211을 재서 모터 ESP32로 1초마다 보고한다.
; 실기기에서 실행한 적 없다. 핀·보정 값은 include/config.h 참고.
; 플랫폼은 원본과 같은 고정 버전(pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12).
; Windows에서 저장소 경로에 한글이 있으면 PLATFORMIO_BUILD_DIR를 ASCII 경로로 둔다.
[platformio]
default_envs = firebeetle32_adc

[env:firebeetle32_adc]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = firebeetle32
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DOUTLET_CT_SOURCE=2
